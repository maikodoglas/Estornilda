<!DOCTYPE html> 
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Santa Estornilda, padroeira dos reembolsos</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw;
    height: 100vh;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Georgia', serif;
    color: #fff;
    overflow: hidden;
  }

  .overlay-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 40px 24px;
    border-radius: 24px;
    background: rgba(10, 5, 30, 0.75);
    border: 3px solid rgba(255, 215, 0, 0.5);
    box-shadow: 0 0 40px rgba(255, 215, 0, 0.15), 0 0 80px rgba(100, 50, 200, 0.2);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: transform 0.4s ease;
  }

  h1 {
    font-size: 1.6rem;
    text-align: center;
    margin-bottom: 6px;
    text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
    color: #ffd700;
  }

  .subtitle {
    font-size: 0.85rem;
    color: #c9b3e8;
    margin-bottom: 24px;
    text-align: center;
  }

  .wheel-container {
    position: relative;
    width: 360px;
    height: 120px;
    overflow: hidden;
    border-radius: 14px;
    border: 3px solid #ffd700;
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.3), inset 0 0 15px rgba(0,0,0,0.6);
    background: rgba(13, 13, 43, 0.9);
  }

  .wheel-strip {
    display: flex;
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    transition: none;
  }

  .wheel-strip.spinning {
    transition: transform 4s cubic-bezier(0.15, 0.85, 0.25, 1);
  }

  .wheel-item {
    width: 360px;
    height: 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 2.4rem;
    font-weight: bold;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    user-select: none;
  }

  .wheel-item .icon {
    font-size: 2.4rem;
    margin-bottom: 2px;
  }

  .wheel-item.sim {
    background: linear-gradient(180deg, #1b5e20, #2e7d32, #1b5e20);
    color: #ffd700;
  }

  .wheel-item.nao {
    background: linear-gradient(180deg, #b71c1c, #c62828, #b71c1c);
    color: #ffcdd2;
  }

  .pointer {
    position: absolute;
    top: 0; bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 3px;
    background: #ffd700;
    z-index: 10;
    box-shadow: 0 0 12px #ffd700;
  }

  .pointer::before, .pointer::after {
    content: '▼';
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    color: #ffd700;
    font-size: 1rem;
    text-shadow: 0 0 8px #ffd700;
  }

  .pointer::before { top: -16px; }
  .pointer::after { bottom: -16px; content: '▲'; }

  .result-display {
    margin-top: 20px;
    font-size: 1.5rem;
    min-height: 1.8em;
    text-align: center;
    font-weight: bold;
    opacity: 0;
    transition: opacity 0.5s ease;
  }

  .result-display.show { opacity: 1; }
  .result-display.sim { color: #69f0ae; text-shadow: 0 0 20px #69f0ae; }
  .result-display.nao { color: #ff5252; text-shadow: 0 0 20px #ff5252; }

  @keyframes glow-pulse {
    0%, 100% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.15), 0 0 80px rgba(100, 50, 200, 0.2); }
    50% { box-shadow: 0 0 60px rgba(255, 215, 0, 0.6), 0 0 120px rgba(100, 50, 200, 0.5); }
  }

  .overlay-box.celebrate {
    animation: glow-pulse 0.6s ease-in-out 6;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    20% { transform: translateX(-6px) rotate(-2deg); }
    40% { transform: translateX(6px) rotate(2deg); }
    60% { transform: translateX(-4px) rotate(-1deg); }
    80% { transform: translateX(4px) rotate(1deg); }
  }

  .overlay-box.shake {
    animation: shake 0.5s ease-in-out 3;
  }

  .particle {
    position: fixed;
    pointer-events: none;
    opacity: 0;
    z-index: 100;
  }

  .particle.active {
    animation: particle-rise 3.5s ease-out forwards;
  }

  @keyframes particle-rise {
    0% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
    100% { opacity: 0; transform: translateY(-300px) scale(0.2) rotate(360deg); }
  }

  .particle.fall.active {
    animation: particle-fall 4s ease-in forwards;
  }

  @keyframes particle-fall {
    0% { opacity: 1; transform: translateY(0) scale(0.5) rotate(0deg); }
    100% { opacity: 0; transform: translateY(400px) scale(0.1) rotate(720deg); }
  }

  .particle.burst.active {
    animation: particle-burst 2.5s ease-out forwards;
  }

  @keyframes particle-burst {
    0% { opacity: 1; transform: translate(0, 0) scale(1.5); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0); }
  }

  .watermark {
    position: fixed;
    bottom: 12px;
    right: 16px;
    font-size: 0.7rem;
    color: rgba(255,255,255,0.15);
    font-family: 'Georgia', serif;
  }
</style>
</head>
<body>

<div class="watermark">⛪ Santa Estornilda, padroeira dos reembolsos</div>

<div class="overlay-box" id="overlayBox">
  <h1>⛪ Santa Estornilda, ⛪</h1>
  <h1>📿 padroeira dos reembolsos 📿</h1>
  <p class="subtitle">🕯️ Descubra a vontade dos santos 🕯️</p>

  <div class="wheel-container">
    <div class="pointer"></div>
    <div class="wheel-strip" id="wheelStrip"></div>
  </div>

  <div class="result-display" id="result"></div>
</div>

<script>
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  // ============================================================
  // SONS
  // ============================================================

  // 1) INTRO — Coral gregoriano + sino único (antes de girar)
  function playIntro() {
    const now = audioCtx.currentTime;

    // Coral: acorde sustentado em vozes (Ré menor = tom sacro)
    const choirFreqs = [146.83, 174.61, 220.00, 293.66]; // D3, F3, A3, D4
    choirFreqs.forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();

      osc.type = 'triangle';
      osc.frequency.value = freq;

      // Vibrato sutil (voz humana)
      const vibrato = audioCtx.createOscillator();
      const vibratoGain = audioCtx.createGain();
      vibrato.frequency.value = 4 + i * 0.5;
      vibratoGain.gain.value = 2;
      vibrato.connect(vibratoGain);
      vibratoGain.connect(osc.frequency);
      vibrato.start(now);
      vibrato.stop(now + 1.4);

      filter.type = 'lowpass';
      filter.frequency.value = 600;

      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.06, now + 0.3);
      gain.gain.linearRampToValueAtTime(0.05, now + 1.0);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 1.4);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 1.5);
    });

    // Sino único de abertura
    const bellFreq = 660;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(bellFreq, now);
    osc.frequency.exponentialRampToValueAtTime(bellFreq * 0.99, now + 1.2);
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.15, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 1.3);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 1.3);

    // Harmônico do sino
    const osc2 = audioCtx.createOscillator();
    const gain2 = audioCtx.createGain();
    osc2.type = 'sine';
    osc2.frequency.value = bellFreq * 2.76;
    gain2.gain.setValueAtTime(0, now);
    gain2.gain.linearRampToValueAtTime(0.04, now + 0.01);
    gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
    osc2.connect(gain2);
    gain2.connect(audioCtx.destination);
    osc2.start(now);
    osc2.stop(now + 0.8);
  }

  // 2) GIRO — Suspense crescente com ticks acelerando + drone + heartbeat
  function playSpinning() {
    const now = audioCtx.currentTime;
    const duration = 4;

    // Ticks acelerando (como roleta) — ficam mais rápidos e agudos
    const totalTicks = 55;
    for (let i = 0; i < totalTicks; i++) {
      // Espaçamento diminui (acelera no início, desacelera no fim)
      const progress = i / totalTicks;
      const t = now + progress * progress * duration * 0.85 + (1 - progress) * progress * duration * 0.5;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = 800 + progress * 1200;
      const vol = 0.03 + progress * 0.05;
      gain.gain.setValueAtTime(vol, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.03);

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 1000 + progress * 2000;
      filter.Q.value = 5;

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.04);
    }

    // Drone misterioso — órgão crescente
    const droneFreqs = [110, 165]; // A2 + E3 (quinta — som de órgão)
    droneFreqs.forEach(freq => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();
      osc.type = 'sawtooth';
      osc.frequency.value = freq;
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(200, now);
      filter.frequency.linearRampToValueAtTime(800, now + duration);
      filter.Q.value = 3;
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.07, now + duration * 0.8);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + duration + 0.1);
    });

    // Heartbeat — batidas graves de tensão
    for (let beat = 0; beat < 6; beat++) {
      const beatTime = now + beat * 0.65;
      for (let sub = 0; sub < 2; sub++) {
        const t = beatTime + sub * 0.12;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = sub === 0 ? 55 : 45;
        const vol = sub === 0 ? 0.15 : 0.1;
        gain.gain.setValueAtTime(vol, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.25);
      }
    }

    // Riser — ruído filtrado crescente (tensão final)
    const bufferSize = audioCtx.sampleRate * duration;
    const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = audioCtx.createBufferSource();
    noise.buffer = noiseBuffer;
    const noiseGain = audioCtx.createGain();
    const noiseFilter = audioCtx.createBiquadFilter();
    noiseFilter.type = 'bandpass';
    noiseFilter.frequency.setValueAtTime(200, now);
    noiseFilter.frequency.exponentialRampToValueAtTime(4000, now + duration);
    noiseFilter.Q.value = 2;
    noiseGain.gain.setValueAtTime(0, now);
    noiseGain.gain.linearRampToValueAtTime(0.04, now + duration * 0.9);
    noiseGain.gain.linearRampToValueAtTime(0, now + duration);
    noise.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(audioCtx.destination);
    noise.start(now);
    noise.stop(now + duration);
  }

  // 3) RESULTADO — Stinger de impacto (momento da revelação)
  function playRevealHit() {
    const now = audioCtx.currentTime;

    // Hit grave de impacto
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(120, now);
    osc.frequency.exponentialRampToValueAtTime(40, now + 0.4);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.5);

    // Crash/shimmer
    const crashSize = audioCtx.sampleRate * 0.5;
    const crashBuf = audioCtx.createBuffer(1, crashSize, audioCtx.sampleRate);
    const cd = crashBuf.getChannelData(0);
    for (let i = 0; i < crashSize; i++) cd[i] = Math.random() * 2 - 1;
    const crash = audioCtx.createBufferSource();
    crash.buffer = crashBuf;
    const crashGain = audioCtx.createGain();
    const crashFilter = audioCtx.createBiquadFilter();
    crashFilter.type = 'highpass';
    crashFilter.frequency.value = 3000;
    crashGain.gain.setValueAtTime(0.08, now);
    crashGain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    crash.connect(crashFilter);
    crashFilter.connect(crashGain);
    crashGain.connect(audioCtx.destination);
    crash.start(now);
    crash.stop(now + 0.5);
  }

  // 4) SIM — Sinos de igreja + coral celestial + fanfarra
  function playChurchBells() {
    const now = audioCtx.currentTime;

    // 3 badaladas
    for (let ring = 0; ring < 3; ring++) {
      const t = now + 0.2 + ring * 0.6;
      const bellHarmonics = [830, 1245, 1660, 2075];
      bellHarmonics.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, t);
        osc.frequency.exponentialRampToValueAtTime(freq * 0.98, t + 2);
        filter.type = 'bandpass';
        filter.frequency.value = freq;
        filter.Q.value = 30;
        const vol = (0.2 - i * 0.04) * (1 - ring * 0.2);
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(vol, t + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 2.5);
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 2.5);
      });
    }

    // Coral celestial — Dó maior com vibrato
    const choirNotes = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6
    choirNotes.forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      const vib = audioCtx.createOscillator();
      const vibG = audioCtx.createGain();
      vib.frequency.value = 5;
      vibG.gain.value = 3;
      vib.connect(vibG);
      vibG.connect(osc.frequency);
      vib.start(now + 0.5);
      vib.stop(now + 5);
      gain.gain.setValueAtTime(0, now + 0.5);
      gain.gain.linearRampToValueAtTime(0.05, now + 1.2);
      gain.gain.linearRampToValueAtTime(0.04, now + 3.5);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 5);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now + 0.5);
      osc.stop(now + 5);
    });

    // Fanfarra — arpegio ascendente
    const fanfareNotes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
    fanfareNotes.forEach((freq, i) => {
      const t = now + 0.1 + i * 0.12;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = freq;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 2000;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.06, t + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.5);
    });
  }

  // 5) NÃO — Órgão grave solene + lamento
  function playOrganSolemn() {
    const now = audioCtx.currentTime;
    const fundamentals = [130.81, 155.56]; // C3 + Eb3 (intervalo menor = triste)

    fundamentals.forEach((freq, idx) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.value = freq;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 400;
      filter.Q.value = 2;
      gain.gain.setValueAtTime(0, now + 0.2);
      gain.gain.linearRampToValueAtTime(0.1, now + 0.5);
      gain.gain.linearRampToValueAtTime(0.08, now + 2);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 3.5);
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now + 0.2 + idx * 0.15);
      osc.stop(now + 3.5);

      // Sub
      const sub = audioCtx.createOscillator();
      const subG = audioCtx.createGain();
      sub.type = 'sine';
      sub.frequency.value = freq / 2;
      subG.gain.setValueAtTime(0, now + 0.2);
      subG.gain.linearRampToValueAtTime(0.12, now + 0.5);
      subG.gain.exponentialRampToValueAtTime(0.001, now + 3.5);
      sub.connect(subG);
      subG.connect(audioCtx.destination);
      sub.start(now + 0.2 + idx * 0.15);
      sub.stop(now + 3.5);
    });

    // Lamento descendente
    const lament = audioCtx.createOscillator();
    const lamentG = audioCtx.createGain();
    lament.type = 'sine';
    lament.frequency.setValueAtTime(440, now + 0.6);
    lament.frequency.exponentialRampToValueAtTime(180, now + 3);
    const vib = audioCtx.createOscillator();
    const vibG = audioCtx.createGain();
    vib.frequency.value = 5;
    vibG.gain.value = 6;
    vib.connect(vibG);
    vibG.connect(lament.frequency);
    vib.start(now + 0.6);
    vib.stop(now + 3);
    lamentG.gain.setValueAtTime(0, now + 0.6);
    lamentG.gain.linearRampToValueAtTime(0.05, now + 1);
    lamentG.gain.exponentialRampToValueAtTime(0.001, now + 3);
    lament.connect(lamentG);
    lamentG.connect(audioCtx.destination);
    lament.start(now + 0.6);
    lament.stop(now + 3.1);

    // 2 batidas graves fúnebres
    for (let i = 0; i < 2; i++) {
      const t = now + 0.15 + i * 0.35;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(80, t);
      osc.frequency.exponentialRampToValueAtTime(35, t + 0.4);
      gain.gain.setValueAtTime(0.2, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.5);
    }
  }

  // ============================================================
  // WHEEL
  // ============================================================
  const PATTERN = [
    { text: 'NÃO', cls: 'nao', icon: '🕯️' },
    { text: 'NÃO', cls: 'nao', icon: '📿' },
    { text: 'SIM', cls: 'sim', icon: '⛪' }
  ];

  const ITEM_WIDTH = 360;
  const COPIES = 60;
  const strip = document.getElementById('wheelStrip');
  const resultEl = document.getElementById('result');
  const overlayBox = document.getElementById('overlayBox');

  let items = [];

  function buildStrip() {
    items = [];
    for (let i = 0; i < COPIES; i++) items.push(...PATTERN);
    strip.innerHTML = '';
    items.forEach(opt => {
      const div = document.createElement('div');
      div.className = `wheel-item ${opt.cls}`;
      div.innerHTML = `<span class="icon">${opt.icon}</span>${opt.text}`;
      strip.appendChild(div);
    });
  }

  function spawnRising(isWin) {
    const symbols = isWin
      ? ['⛪', '✨', '🙏', '🕯️', '💛', '🌟', '👏', '🎉', '🎊', '✝️']
      : ['📿', '🕯️', '✝️'];
    const count = isWin ? 30 : 8;
    for (let i = 0; i < count; i++) {
      const el = document.createElement('span');
      el.className = 'particle';
      el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      el.style.left = (5 + Math.random() * 90) + 'vw';
      el.style.top = (40 + Math.random() * 50) + 'vh';
      el.style.fontSize = (1.2 + Math.random() * 2) + 'rem';
      document.body.appendChild(el);
      setTimeout(() => el.classList.add('active'), i * 60);
      setTimeout(() => el.remove(), 4500 + i * 60);
    }
  }

  function spawnFalling() {
    const symbols = ['🎉', '🎊', '✨', '💫', '⭐', '🌟', '💛', '🕯️', '⛪'];
    for (let i = 0; i < 25; i++) {
      const el = document.createElement('span');
      el.className = 'particle fall';
      el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      el.style.left = (5 + Math.random() * 90) + 'vw';
      el.style.top = (-5 + Math.random() * 10) + 'vh';
      el.style.fontSize = (1 + Math.random() * 1.8) + 'rem';
      document.body.appendChild(el);
      setTimeout(() => el.classList.add('active'), i * 80);
      setTimeout(() => el.remove(), 5000 + i * 80);
    }
  }

  function spawnBurst() {
    const symbols = ['🎉', '🎊', '✨', '💥', '⛪', '💛', '🌟', '🙏'];
    for (let i = 0; i < 20; i++) {
      const el = document.createElement('span');
      el.className = 'particle burst';
      el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      const angle = (Math.PI * 2 / 20) * i + Math.random() * 0.3;
      const dist = 150 + Math.random() * 250;
      el.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      el.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      el.style.left = '50vw';
      el.style.top = '50vh';
      el.style.fontSize = (1.5 + Math.random() * 1.5) + 'rem';
      document.body.appendChild(el);
      setTimeout(() => el.classList.add('active'), i * 40);
      setTimeout(() => el.remove(), 3500 + i * 40);
    }
  }

  function spin() {
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const roll = Math.floor(Math.random() * 3);
    const isWin = roll === 0;

    buildStrip();
    strip.style.transform = 'translateX(0px)';
    void strip.offsetWidth;

    const minIdx = Math.floor(items.length * 0.4);
    const maxIdx = Math.floor(items.length * 0.75);
    const candidates = [];
    for (let i = minIdx; i < maxIdx; i++) {
      if (isWin && items[i].text === 'SIM') candidates.push(i);
      if (!isWin && items[i].text === 'NÃO') candidates.push(i);
    }

    const targetIdx = candidates[Math.floor(Math.random() * candidates.length)];
    const targetOffset = targetIdx * ITEM_WIDTH;
    const chosen = items[targetIdx];

    // 🔔 Som de intro (coral + sino)
    playIntro();

    // Após a intro, inicia o giro
    setTimeout(() => {
      // 🎰 Som de suspense durante o giro
      playSpinning();

      strip.classList.add('spinning');
      strip.style.transform = `translateX(${-targetOffset}px)`;

      setTimeout(() => {
        // 💥 Hit de revelação
        playRevealHit();

        resultEl.textContent = chosen.text === 'SIM'
          ? '⛪ SIM! Os santos abençoaram! ⛪'
          : '📿 NÃO... Os santos disseram não! 🕯️';
        resultEl.className = `result-display ${chosen.cls} show`;

        // Som temático após pequeno delay do hit
        setTimeout(() => {
          if (isWin) {
            playChurchBells();
          } else {
            playOrganSolemn();
          }
        }, 200);

        spawnRising(isWin);

        if (isWin) {
          overlayBox.classList.add('celebrate');
          spawnFalling();
          setTimeout(() => spawnBurst(), 300);
          setTimeout(() => spawnRising(true), 800);
          setTimeout(() => spawnFalling(), 1500);
          setTimeout(() => spawnBurst(), 2000);
        } else {
          overlayBox.classList.add('shake');
        }
      }, 4200);
    }, 1500); // espera a intro terminar
  }

  // Auto-spin
  setTimeout(spin, 1000);
</script>
</body>
</html>
